<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Quantum Torus Gradient -->
    <linearGradient id="quantuneRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Tuning Frequency Wave Gradient -->
    <linearGradient id="quantuneWaveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="quantuneNodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="quantuneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Quantum "Q" Orbital Loop (Transparent Background) -->
  <circle cx="31" cy="30" r="19" 
          stroke="url(#quantuneRingGrad)" 
          stroke-width="5.2" 
          stroke-linecap="round"
          filter="url(#quantuneGlow)"/>

  <!-- Harmonic Tuning Waveform (Oscilloscope Frequency Curve inside the Q) -->
  <path d="M 16 30 C 20.5 30 22 21 26 21 C 29.5 21 31.5 39 35.5 39 C 39 39 40.5 30 46 30" 
        fill="none" 
        stroke="url(#quantuneWaveGrad)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#quantuneGlow)"/>

  <!-- Quantization Precision Nodes -->
  <circle cx="26" cy="21" r="2.5" fill="#00F0FF" filter="url(#quantuneGlow)"/>
  <circle cx="35.5" cy="39" r="2.5" fill="#C084FC" filter="url(#quantuneGlow)"/>
  <circle cx="31" cy="30" r="1.5" fill="#FFFFFF"/>

  <!-- The "Q" Tuning Slider Pulse Tail (Energy Vector) -->
  <path d="M 39 38 L 52 51" 
        stroke="url(#quantuneRingGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round"
        filter="url(#quantuneGlow)"/>

  <!-- Slider Calibration Node on Q Tail -->
  <circle cx="49" cy="48" r="2.6" fill="#D946EF" filter="url(#quantuneGlow)"/>
  <circle cx="49" cy="48" r="1" fill="#FFFFFF"/>
</svg>
